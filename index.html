<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  
  html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; background-color: #F8FAFC; }
  *, *::before, *::after { box-sizing: border-box; }
  
  /* Custom Scrollbar for sleekness */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

  /* Animations */
  .shake { animation: shakeKf .4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shakeKf {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }
  
  .tab-fade { animation: tabFadeIn .3s ease-out; }
  @keyframes tabFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .modal-slide-up { animation: slideUp .4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Specific styles to remove standard browser appearances */
  input[type="date"]::-webkit-calendar-picker-indicator { 
    opacity: 0.5; cursor: pointer; transition: 0.2s; 
  }
  input[type="date"]::-webkit-calendar-picker-indicator:hover {
    opacity: 0.8;
  }
  
  .font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif; }
  .font-inter { font-family: 'Inter', sans-serif; }
</style>

/* ---- STREAMING_CHUNK: Building Utility Functions ---- */
const pad2 = (n) => String(n).padStart(2, '0');
const localDateStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDateStr = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const formatRupiah = (n) => {
  const num = Number(n) || 0;
  return (num < 0 ? '-Rp' : 'Rp') + Math.abs(num).toLocaleString('id-ID');
};
const sumBy = (list, pred) => list.filter(pred).reduce((a, t) => a + t.jumlah, 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const SETTINGS_KEYS = ['pins', 'categories', 'budgets', 'recurring', 'goals'];

async function sheetsGet(url) {
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();

  const rawTx = Array.isArray(data) ? data : (data.transactions || []);
  const transactions = rawTx.map((row) => ({
    id: String(row.id),
    tanggal: String(row.tanggal),
    jenis: row.jenis === 'masuk' ? 'masuk' : 'keluar',
    kategori: row.kategori,
    jumlah: Number(row.jumlah) || 0,
    catatan: row.catatan || '',
    oleh: row.oleh === 'Umi' ? 'Umi' : 'Abi',
    dibuatPada: Number(row.dibuatPada) || 0,
  }));

  const result = { transactions };
  SETTINGS_KEYS.forEach((k) => {
    result[k] = (!Array.isArray(data) && data[k]) ? data[k] : null;
  });

  return result;
}

async function sheetsPost(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (!data || data.ok !== true) throw new Error((data && data.error) || 'Gagal menyimpan ke Sheet');
  return data;
}

async function sheetsPostSettings(url, settings = {}) {
  return sheetsPost(url, { action: 'saveSettings', ...settings });
}

function formatDateLong(dateStr) {
  const d = parseDateStr(dateStr);
  return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]} ${d.getFullYear()}`;
}

/* ---- STREAMING_CHUNK: Redesigning Lock Screen ---- */
function LockScreen({ pins, onUnlock }) {
  const [selected, setSelected] = useState(null);
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);

  const handleDigit = (d) => {
    if (!selected || pin.length >= 4) return;
    const next = pin + d;
    setPin(next);
    if (next.length === 4) {
      setTimeout(() => {
        if (next === pins[selected]) {
          onUnlock(selected);
        } else {
          setError(true);
          setTimeout(() => setError(false), 400);
          setPin('');
        }
      }, 120);
    }
  };

  return (
    <div className="flex flex-col items-center justify-center min-h-screen px-6 py-10 bg-white">
      <div className="mb-10 text-center animate-fade-in-up">
        <div className="w-16 h-16 mx-auto bg-gradient-to-br from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-5">
          <Wallet size={32} color="white" />
        </div>
        <div className="text-3xl font-extrabold font-jakarta text-slate-900 tracking-tight">
          Kas Keluarga
        </div>
        <div className="text-sm mt-2 text-slate-500 font-medium">Platform Keuangan Rumah Tangga</div>
      </div>

      <div className="flex gap-4 mb-10 w-full max-w-[260px]">
        {['Abi', 'Umi'].map((u) => {
          const active = selected === u;
          const isAbi = u === 'Abi';
          const activeBg = isAbi ? 'bg-blue-600' : 'bg-violet-600';
          const shadow = isAbi ? 'shadow-blue-500/30' : 'shadow-violet-500/30';
          return (
            <button
              key={u}
              onClick={() => { setSelected(u); setPin(''); }}
              className={`flex-1 py-3.5 rounded-2xl text-sm font-semibold transition-all duration-300 ${
                active 
                  ? `${activeBg} text-white shadow-lg ${shadow} scale-105` 
                  : 'bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100'
              }`}
            >
              {u}
            </button>
          );
        })}
      </div>

      <div className="min-h-[280px] w-full flex flex-col items-center">
        {selected ? (
          <div className={`w-full transition-all ${error ? 'shake' : ''}`}>
            <div className="mb-8"><PinDots length={4} filled={pin.length} /></div>
            <div className="h-6 mb-2">
              {error && (
                <div className="text-center text-sm font-semibold text-rose-500">PIN salah, coba lagi</div>
              )}
            </div>
            <PinPad onDigit={handleDigit} onBackspace={() => setPin(pin.slice(0, -1))} />
          </div>
        ) : (
          <div className="text-sm text-center max-w-[220px] text-slate-400 mt-8 font-medium">
            Pilih pengguna untuk masuk dan catat transaksi.
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- STREAMING_CHUNK: Designing Main Transaction Inputs ---- */
function CatatTab({ user, transactions, onSave, onEdit, onDelete, editingTx, cancelEdit, categories, recurring }) {
  const [date, setDate] = useState(localDateStr());
  const [type, setType] = useState('keluar');
  const [category, setCategory] = useState(categories.keluar[0] || '');
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const [amountError, setAmountError] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  useEffect(() => {
    if (editingTx) {
      setDate(editingTx.tanggal);
      setType(editingTx.jenis);
      setCategory(editingTx.kategori);
      setAmount(String(editingTx.jumlah));
      setNote(editingTx.catatan || '');
    }
  }, [editingTx]);

  useEffect(() => {
    if (!categories[type].includes(category)) {
      setCategory(categories[type][0] || '');
    }
  }, [categories, type]);

  const changeType = (t) => {
    setType(t);
    if (!categories[t].includes(category)) setCategory(categories[t][0] || '');
  };

  const handleAmountChange = (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, '');
    setAmount(digits);
    setAmountError(false);
  };

  const submit = () => {
    const num = Number(amount);
    if (!num || num <= 0) { setAmountError(true); return; }
    if (!category) return;
    onSave({
      id: editingTx ? editingTx.id : uid(),
      tanggal: date,
      jenis: type,
      kategori: category,
      jumlah: num,
      catatan: note.trim(),
      oleh: editingTx ? editingTx.oleh : user,
      dibuatPada: editingTx ? editingTx.dibuatPada : Date.now(),
    });
    setAmount('');
    setNote('');
    if (editingTx) cancelEdit();
  };

  const todayList = useMemo(
    () => transactions.filter((t) => t.tanggal === localDateStr()).sort((a, b) => b.dibuatPada - a.dibuatPada),
    [transactions]
  );

  const missingRecurring = useMemo(() => {
    const thisMonth = localDateStr().slice(0, 7);
    const recordedThisMonth = new Set(
      transactions.filter((t) => t.jenis === 'keluar' && t.tanggal.slice(0, 7) === thisMonth).map((t) => t.kategori)
    );
    return recurring.filter((cat) => categories.keluar.includes(cat) && !recordedThisMonth.has(cat));
  }, [transactions, recurring, categories]);

  const pickMissingCategory = (cat) => {
    setType('keluar');
    setCategory(cat);
  };

  const isMasuk = type === 'masuk';

  return (
    <div className="px-5 pb-10">
      {missingRecurring.length > 0 && (
        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-6 shadow-sm">
          <div className="flex items-center gap-2 mb-2 text-amber-800">
            <Bell size={16} />
            <span className="text-sm font-bold">Tagihan Rutin Belum Tercatat</span>
          </div>
          <div className="flex flex-wrap gap-2 mt-2">
            {missingRecurring.map((cat) => (
              <button
                key={cat}
                onClick={() => pickMissingCategory(cat)}
                className="text-xs font-semibold px-3 py-1.5 rounded-full bg-white border border-amber-300 text-amber-700 shadow-sm hover:bg-amber-100 transition-colors"
              >
                + {cat}
              </button>
            ))}
          </div>
        </div>
      )}

      {editingTx && (
        <div className="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-2xl px-4 py-3 mb-6 shadow-sm">
          <span className="text-sm font-semibold text-blue-800">Mode Edit Catatan</span>
          <button onClick={cancelEdit} className="flex items-center gap-1.5 text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-full border border-rose-200">
            <X size={14} /> Batal
          </button>
        </div>
      )}

      {/* Segmented type toggle */}
      <div className="flex p-1 bg-slate-100 rounded-2xl mb-6 shadow-inner border border-slate-200/60">
        {[
          { key: 'masuk', label: 'Pemasukan' },
          { key: 'keluar', label: 'Pengeluaran' },
        ].map((opt) => {
          const active = type === opt.key;
          const isM = opt.key === 'masuk';
          const activeClass = isM 
            ? 'bg-white text-emerald-600 shadow-md border-slate-200/50' 
            : 'bg-white text-rose-600 shadow-md border-slate-200/50';
          return (
            <button
              key={opt.key}
              onClick={() => changeType(opt.key)}
              className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 border ${
                active ? activeClass : 'bg-transparent text-slate-500 border-transparent hover:text-slate-700'
              }`}
            >
              {opt.label}
            </button>
          );
        })}
      </div>

      {/* Amount Input */}
      <div className="mb-6 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Jumlah</label>
        <div
          className={`flex items-center transition-all ${amountError ? 'border-b-2 border-rose-500' : 'border-b-2 border-slate-200'} focus-within:border-blue-500 pb-2`}
        >
          <span className={`text-3xl font-extrabold font-jakarta mr-2 ${isMasuk ? 'text-emerald-500' : 'text-slate-800'}`}>Rp</span>
          <input
            inputMode="numeric"
            value={amount ? Number(amount).toLocaleString('id-ID') : ''}
            onChange={handleAmountChange}
            placeholder="0"
            className={`flex-1 bg-transparent outline-none py-1 text-4xl font-extrabold font-jakarta w-full ${isMasuk ? 'text-emerald-500' : 'text-slate-900'}`}
          />
        </div>
        {amountError && <div className="text-xs font-semibold mt-2 text-rose-500">Masukkan jumlah yang valid</div>}
      </div>

      {/* Category Selection */}
      <div className="mb-6">
        <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 px-1">Kategori</label>
        {categories[type].length === 0 ? (
          <div className="text-sm text-slate-500 px-1">Belum ada kategori. Tambahkan di Pengaturan.</div>
        ) : (
          <div className="flex flex-wrap gap-2.5">
            {categories[type].map((cat) => {
              const active = category === cat;
              return (
                <button
                  key={cat}
                  onClick={() => setCategory(cat)}
                  className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 border ${
                    active 
                      ? 'bg-slate-900 text-white border-slate-900 shadow-md' 
                      : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                  }`}
                >
                  {cat}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* Date & Note Grid */}
      <div className="grid grid-cols-2 gap-4 mb-8">
        <div>
          <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">Tanggal</label>
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="w-full bg-white rounded-xl px-4 py-3 text-sm font-medium text-slate-800 outline-none border border-slate-200 focus:ring-2 focus:ring-blue-500/30 transition-all shadow-sm"
          />
        </div>
        <div>
          <label className="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2 px-1">Catatan</label>
          <input
            type="text"
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder="Opsional..."
            className="w-full bg-white rounded-xl px-4 py-3 text-sm font-medium text-slate-800 outline-none border border-slate-200 focus:ring-2 focus:ring-blue-500/30 transition-all shadow-sm"
          />
        </div>
      </div>

      <button
        onClick={submit}
        className="w-full py-4 rounded-2xl text-base font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-blue-500/25 bg-blue-600 text-white hover:bg-blue-700"
      >
        <Plus size={20} strokeWidth={2.5} /> {editingTx ? 'Simpan Perubahan' : 'Catat Transaksi'}
      </button>

      {/* Today's list */}
      <div className="mt-10">
        <div className="text-sm font-bold text-slate-900 mb-4 px-1 flex items-center justify-between">
          <span>Hari Ini</span>
          <span className="text-xs font-medium text-slate-400 bg-slate-100 px-2 py-1 rounded-full">{todayList.length} aktivitas</span>
        </div>
        {todayList.length === 0 ? (
          <div className="rounded-3xl p-8 text-center bg-slate-50 border border-slate-200 border-dashed">
            <div className="text-3xl mb-3 opacity-80">🍃</div>
            <div className="text-sm font-medium text-slate-500">Belum ada catatan hari ini.<br/>Yuk mulai kelola keuanganmu.</div>
          </div>
        ) : (
          <div className="space-y-3">
            {todayList.map((t) => (
              <TxRow
                key={t.id}
                t={t}
                confirming={confirmDeleteId === t.id}
                onEdit={() => onEdit(t)}
                onDeleteClick={() => setConfirmDeleteId(t.id)}
                onConfirmDelete={() => { onDelete(t.id); setConfirmDeleteId(null); }}
                onCancelDelete={() => setConfirmDeleteId(null)}
              />
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- STREAMING_CHUNK: Beautiful Transaction Row ---- */
function formatDateShort(dateStr) {
  const d = parseDateStr(dateStr);
  return `${d.getDate()} ${BULAN[d.getMonth()].slice(0, 3)} '${String(d.getFullYear()).slice(2)}`;
}

function TxRow({ t, confirming, onEdit, onDeleteClick, onConfirmDelete, onCancelDelete, showDate }) {
  const isMasuk = t.jenis === 'masuk';
  const amountColor = isMasuk ? 'text-emerald-500' : 'text-slate-900';
  const sign = isMasuk ? '+' : '-';

  if (confirming) {
    return (
      <div className="flex flex-col sm:flex-row sm:items-center justify-between rounded-xl p-3 text-xs bg-rose-50 border border-rose-200 shadow-sm gap-2">
        <span className="font-semibold text-rose-800">Hapus catatan ini secara permanen?</span>
        <div className="flex gap-2 w-full sm:w-auto">
          <button onClick={onConfirmDelete} className="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-600 text-white shadow-sm hover:bg-rose-700">Ya, Hapus</button>
          <button onClick={onCancelDelete} className="flex-1 sm:flex-none px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-700 border border-slate-200 hover:bg-slate-50">Batal</button>
        </div>
      </div>
    );
  }
  return (
    <div className="group flex items-center justify-between rounded-xl py-2.5 px-3.5 bg-white border border-slate-100 shadow-sm hover:shadow-md hover:border-slate-200 transition-all duration-200">
      <div className="min-w-0 flex-1 pr-3">
        <div className="flex items-center gap-2 mb-0.5 flex-wrap">
          <span className="text-sm font-bold text-slate-800 truncate">{t.kategori}</span>
          <UserTag user={t.oleh} size="sm" />
          {showDate && <span className="text-[10px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">{formatDateShort(t.tanggal)}</span>}
        </div>
        {t.catatan && <div className="text-[11px] font-medium text-slate-500 truncate">{t.catatan}</div>}
      </div>
      <div className="flex items-center gap-3 flex-shrink-0">
        <span className={`text-sm font-extrabold font-jakarta whitespace-nowrap ${amountColor}`}>
          {sign}{formatRupiah(t.jumlah)}

function MonthCalendar({ year, month, transactions, filter, onPickDay }) {
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const todayStr = localDateStr();

  const netFor = (day) => {
    const ds = `${year}-${pad2(month + 1)}-${pad2(day)}`;
    const dayTx = transactions.filter((t) => t.tanggal === ds && (filter === 'Gabungan' || t.oleh === filter));
    if (dayTx.length === 0) return null;
    return sumBy(dayTx, (t) => t.jenis === 'masuk') - sumBy(dayTx, (t) => t.jenis === 'keluar');
  };

  return (
    <div className="bg-white rounded-3xl p-5 mb-6 shadow-sm border border-slate-100">
      <div className="grid grid-cols-7 mb-3">
        {HARI_PENDEK.map((h, i) => (
          <div key={i} className="text-center text-[10px] font-bold text-slate-400">{h}</div>
        ))}
      </div>
      <div className="grid grid-cols-7 gap-y-2 gap-x-1">
        {cells.map((day, i) => {
          if (day === null) return <div key={i} />;
          const ds = `${year}-${pad2(month + 1)}-${pad2(day)}`;
          const net = netFor(day);
          const isToday = ds === todayStr;
          let dotColor = 'transparent';
          if (net !== null) dotColor = net > 0 ? C.income : net < 0 ? C.expense : C.inkSoft;
          
          return (
            <button
              key={i}
              onClick={() => onPickDay(ds)}
              className="flex flex-col items-center py-1.5 rounded-xl hover:bg-slate-50 transition-colors group relative"
            >
              <span
                className={`text-xs font-bold w-7 h-7 flex items-center justify-center rounded-full transition-all ${
                  isToday ? 'bg-blue-600 text-white shadow-md shadow-blue-500/30' : 'text-slate-700'
                }`}
              >
                {day}
              </span>
              <span className={`w-1.5 h-1.5 rounded-full mt-1 transition-all ${net !== null ? 'scale-100' : 'scale-0'}`} style={{ backgroundColor: dotColor }} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

const PIE_PALETTE = ['#2563EB', '#DC2626', '#16A34A', '#D97706', '#9333EA', '#0891B2', '#BE123C', '#EA580C', '#65A30D', '#4F46E5'];

function DonutChart({ items }) {
  const total = items.reduce((s, i) => s + i.value, 0);
  if (total <= 0) return null;
  const size = 160;
  const r = 60;
  const strokeWidth = 24;
  const circumference = 2 * Math.PI * r;
  let offsetAcc = 0;

  return (
    <div className="flex items-center gap-6">
      <div className="relative">
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90">
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#F1F5F9" strokeWidth={strokeWidth} />
          {items.map((item, i) => {
            const frac = item.value / total;
            const dash = frac * circumference;
            const seg = (
              <circle
                key={item.label}
                cx={size / 2} cy={size / 2} r={r} fill="none"
                stroke={PIE_PALETTE[i % PIE_PALETTE.length]}
                strokeWidth={strokeWidth}
                strokeDasharray={`${dash} ${circumference - dash}`}
                strokeDashoffset={-offsetAcc}
                className="transition-all duration-700 ease-out drop-shadow-sm"
              />
            );
            offsetAcc += dash;
            return seg;
          })}
        </svg>
      </div>
      <div className="flex-1 min-w-0 space-y-2.5 py-2">
        {items.slice(0, 5).map((item, i) => (
          <div key={item.label} className="flex items-center gap-2 text-[11px] font-bold">
            <span className="w-2.5 h-2.5 rounded-full shadow-sm" style={{ backgroundColor: PIE_PALETTE[i % PIE_PALETTE.length] }} />
            <span className="truncate flex-1 text-slate-600">{item.label}</span>
            <span className="text-slate-400">{Math.round((item.value / total) * 100)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function BulananTab({ transactions, onPickDay, budgets, goals }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [filter, setFilter] = useState('Gabungan');

  const shiftMonth = (delta) => {
    let m = month + delta, y = year;
    if (m < 0) { m = 11; y -= 1; }
    if (m > 11) { m = 0; y += 1; }
    setMonth(m); setYear(y);
  };

  const monthStr = `${year}-${pad2(month + 1)}`;
  const list = useMemo(
    () => transactions.filter((t) => t.tanggal.slice(0, 7) === monthStr && (filter === 'Gabungan' || t.oleh === filter)),
    [transactions, monthStr, filter]
  );

  const masuk = sumBy(list, (t) => t.jenis === 'masuk');
  const keluar = sumBy(list, (t) => t.jenis === 'keluar');

  const groupByCategory = (jenis) => {
    const map = {};
    list.filter((t) => t.jenis === jenis).forEach((t) => {
      map[t.kategori] = (map[t.kategori] || 0) + t.jumlah;
    });
    return Object.entries(map)
      .map(([label, value]) => ({ label, value }))
      .sort((a, b) => b.value - a.value);
  };

  const pengeluaranBreakdown = groupByCategory('keluar');
  const pemasukanBreakdown = groupByCategory('masuk');

  const monthAll = useMemo(
    () => transactions.filter((t) => t.tanggal.slice(0, 7) === monthStr),
    [transactions, monthStr]
  );
  const abiMasuk = sumBy(monthAll, (t) => t.jenis === 'masuk' && t.oleh === 'Abi');
  const umiMasuk = sumBy(monthAll, (t) => t.jenis === 'masuk' && t.oleh === 'Umi');
  const abiKeluar = sumBy(monthAll, (t) => t.jenis === 'keluar' && t.oleh === 'Abi');
  const umiKeluar = sumBy(monthAll, (t) => t.jenis === 'keluar' && t.oleh === 'Umi');

  const monthStartStr = `${year}-${pad2(month + 1)}-01`;
  const openingBalance = useMemo(
    () => transactions
      .filter((t) => t.tanggal < monthStartStr)
      .reduce((acc, t) => acc + (t.jenis === 'masuk' ? t.jumlah : -t.jumlah), 0),
    [transactions, monthStartStr]
  );
  const masukGabungan = sumBy(monthAll, (t) => t.jenis === 'masuk');
  const keluarGabungan = sumBy(monthAll, (t) => t.jenis === 'keluar');
  const closingBalance = openingBalance + masukGabungan - keluarGabungan;

  const spentByCategory = useMemo(() => {
    const map = {};
    monthAll.filter((t) => t.jenis === 'keluar').forEach((t) => {
      map[t.kategori] = (map[t.kategori] || 0) + t.jumlah;
    });
    return map;
  }, [monthAll]);

  return (
    <div className="px-5 pb-10 flex flex-col items-center">
      <div className="w-full flex items-center justify-between mb-6 mt-2 bg-white rounded-2xl p-2 shadow-sm border border-slate-100">
        <button onClick={() => shiftMonth(-1)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-xl transition-colors"><ChevronLeft size={20} /></button>
        <div className="text-base font-extrabold text-slate-800 font-jakarta">{BULAN[month]} {year}</div>
        <button onClick={() => shiftMonth(1)} className="p-2 text-slate-400 hover:bg-slate-100 rounded-xl transition-colors"><ChevronRight size={20} /></button>
      </div>

      <div className="w-full bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl p-5 mb-6 shadow-xl shadow-slate-900/20 text-white relative overflow-hidden">
        <div className="absolute -right-6 -top-6 opacity-5"><Wallet size={120} /></div>
        <div className="grid grid-cols-2 gap-4 relative z-10">
          <div>
            <div className="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Saldo Awal</div>
            <div className="text-lg font-extrabold font-jakarta">{formatRupiah(openingBalance)}</div>
          </div>
          <div>
            <div className="text-[10px] font-bold uppercase tracking-wider text-blue-400 mb-1">Saldo Akhir</div>
            <div className="text-lg font-extrabold font-jakarta text-blue-100">{formatRupiah(closingBalance)}</div>
          </div>
          <div className="col-span-2 text-[10px] font-medium text-slate-500 mt-2 border-t border-slate-700/50 pt-3 flex items-center gap-1.5">
            <Icon size={12}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Icon>
            Saldo gabungan seluruh kas, tidak terpengaruh filter
          </div>
        </div>

function CategoryManager({ categories, onSave, recurring, onSaveRecurring, budgets, onSaveBudgets }) {
  const [type, setType] = useState('keluar');
  const [newCat, setNewCat] = useState('');
  const [editingIndex, setEditingIndex] = useState(null);
  const [editValue, setEditValue] = useState('');
  const [error, setError] = useState('');

  const list = categories[type];

  const addCategory = () => {
    const val = newCat.trim();
    if (!val) return;
    if (list.some((c) => c.toLowerCase() === val.toLowerCase())) { setError('Kategori sudah ada.'); return; }
    onSave({ ...categories, [type]: [...list, val] });
    setNewCat('');
    setError('');
  };

  const startEdit = (i) => {
    setEditingIndex(i);
    setEditValue(list[i]);
    setError('');
  };

  const saveEdit = () => {
    const val = editValue.trim();
    if (!val) return;
    if (list.some((c, i) => i !== editingIndex && c.toLowerCase() === val.toLowerCase())) {
      setError('Nama kategori sudah dipakai.');
      return;
    }
    const oldName = list[editingIndex];
    const next = [...list];
    next[editingIndex] = val;
    onSave({ ...categories, [type]: next });
    if (type === 'keluar' && oldName !== val) {
      if (recurring.includes(oldName)) onSaveRecurring(recurring.map((c) => (c === oldName ? val : c)));
      if (budgets[oldName] !== undefined) {
        const nb = { ...budgets };
        nb[val] = nb[oldName];
        delete nb[oldName];
        onSaveBudgets(nb);
      }
    }
    setEditingIndex(null);
    setError('');
  };

  const deleteCategory = (i) => {
    if (list.length <= 1) { setError('Minimal 1 kategori harus tersisa.'); return; }
    const removed = list[i];
    onSave({ ...categories, [type]: list.filter((_, idx) => idx !== i) });
    if (type === 'keluar') {
      if (recurring.includes(removed)) onSaveRecurring(recurring.filter((c) => c !== removed));
      if (budgets[removed] !== undefined) {
        const nb = { ...budgets };
        delete nb[removed];
        onSaveBudgets(nb);
      }
    }
    setError('');
  };

  const toggleRecurring = (cat) => {
    if (recurring.includes(cat)) onSaveRecurring(recurring.filter((c) => c !== cat));
    else onSaveRecurring([...recurring, cat]);
  };

  return (
    <div className="mb-8">
      <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Kelola Kategori</div>
      
      <div className="flex p-1 bg-slate-100 rounded-xl mb-4 border border-slate-200/60 w-max">
        {[{ k: 'keluar', l: 'Pengeluaran' }, { k: 'masuk', l: 'Pemasukan' }].map((opt) => (
          <button
            key={opt.k}
            onClick={() => { setType(opt.k); setEditingIndex(null); setError(''); }}
            className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${
              type === opt.k ? 'bg-white text-slate-900 shadow-sm border border-slate-200/50' : 'bg-transparent text-slate-500 hover:text-slate-700 border border-transparent'
            }`}
          >
            {opt.l}
          </button>
        ))}
      </div>
      
      {type === 'keluar' && (
        <div className="text-[11px] font-medium text-slate-400 mb-3 flex items-center gap-1.5">
          <Bell size={12}/> Aktifkan ikon lonceng untuk pengingat tagihan rutin bulanan.
        </div>
      )}

      <div className="space-y-2 mb-4">
        {list.length === 0 && <div className="text-xs font-medium text-slate-400 p-4 border border-dashed border-slate-200 rounded-xl text-center">Belum ada kategori.</div>}
        {list.map((cat, i) => (
          <div key={i} className="flex items-center justify-between rounded-xl px-4 py-3 bg-white border border-slate-100 shadow-sm hover:border-slate-200 transition-all group">
            {editingIndex === i ? (
              <input
                autoFocus
                value={editValue}
                onChange={(e) => setEditValue(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') saveEdit(); }}
                className="flex-1 bg-slate-50 rounded-lg px-2 py-1 outline-none text-sm font-semibold text-slate-800 mr-3 border border-slate-200 focus:border-blue-400"
              />
            ) : (
              <span className="text-sm font-bold text-slate-700">{cat}</span>
            )}
            <div className="flex items-center gap-2">
              {editingIndex === i ? (
                <>
                  <button onClick={saveEdit} className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">Simpan</button>
                  <button onClick={() => { setEditingIndex(null); setError(''); }} className="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-1 rounded-lg">Batal</button>
                </>
              ) : (
                <>
                  {type === 'keluar' && (
                    <button
                      onClick={() => toggleRecurring(cat)}
                      className={`p-1.5 rounded-lg transition-colors ${recurring.includes(cat) ? 'text-amber-500 bg-amber-50' : 'text-slate-300 hover:text-amber-500 hover:bg-slate-50'}`}
                      title="Kategori Rutin"
                    >
                      <Bell size={14} />
                    </button>
                  )}
                  <button onClick={() => startEdit(i)} className="p-1.5 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors"><Pencil size={14} /></button>
                  <button onClick={() => deleteCategory(i)} className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors"><Trash2 size={14} /></button>
                </>
              )}
            </div>
          </div>
        ))}
      </div>

      {error && <div className="text-xs font-bold text-rose-500 mb-3">{error}</div>}

      <div className="flex gap-2">
        <input
          value={newCat}
          onChange={(e) => { setNewCat(e.target.value); setError(''); }}
          onKeyDown={(e) => { if (e.key === 'Enter') addCategory(); }}
          placeholder="Nama kategori baru..."
          className="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-800 outline-none focus:ring-2 focus:ring-blue-500/30 transition-all shadow-sm"
        />
        <button onClick={addCategory} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-slate-900 text-white shadow-sm hover:bg-slate-800 transition-colors">
          Tambah
        </button>
      </div>
    </div>
  );
}

function BudgetManager({ categories, budgets, onSave }) {
  const [amounts, setAmounts] = useState({});

  const getDisplay = (cat) => {
    if (amounts[cat] !== undefined) return amounts[cat];
    return budgets[cat] ? String(budgets[cat]) : '';
  };

  const handleChange = (cat, raw) => {
    const digits = raw.replace(/[^0-9]/g, '');
    setAmounts((a) => ({ ...a, [cat]: digits }));
  };

  const handleBlur = (cat) => {
    const digits = amounts[cat];
    if (digits === undefined) return;
    const next = { ...budgets };
    if (!digits || Number(digits) === 0) delete next[cat];
    else next[cat] = Number(digits);
    onSave(next);
  };

  return (
    <div className="mb-8">
      <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Anggaran Bulanan</div>
      <div className="text-[11px] font-medium text-slate-400 mb-4">Biarkan kosong atau isi 0 untuk kategori tanpa batas.</div>
      <div className="space-y-3">
        {categories.keluar.map((cat) => (
          <div key={cat} className="flex items-center gap-3">
            <span className="text-sm font-bold text-slate-700 flex-1 truncate">{cat}</span>
            <div className="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all w-32 shadow-sm">
              <span className="text-xs font-bold text-slate-400 mr-1">Rp</span>
              <input
                inputMode="numeric"
                value={getDisplay(cat) ? Number(getDisplay(cat)).toLocaleString('id-ID') : ''}
                onChange={(e) => handleChange(cat, e.target.value)}
                onBlur={() => handleBlur(cat)}
                placeholder="0"
                className="w-full bg-transparent outline-none text-sm font-jakarta font-bold py-2.5 text-right text-slate-800"
              />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SavingsGoalManager({ categories, goals, onSave }) {
  const [name, setName] = useState('');
  const [category, setCategory] = useState(categories.keluar[0] || '');
  const [target, setTarget] = useState('');
  const [error, setError] = useState('');

  const addGoal = () => {
    const n = name.trim();
    const t = Number(target);
    if (!n) { setError('Nama target belum diisi.'); return; }
    if (!category) { setError('Pilih kategori dulu.'); return; }
    if (!t || t <= 0) { setError('Jumlah target harus > 0.'); return; }
    onSave([...goals, { id: uid(), name: n, category, target: t }]);
    setName(''); setTarget(''); setError('');
  };

  const deleteGoal = (id) => onSave(goals.filter((g) => g.id !== id));

  return (
    <div className="mb-8">
      <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Target Tabungan</div>
      <div className="text-[11px] font-medium text-slate-400 mb-4">Akumulasi pengeluaran pada kategori pilihan sepanjang waktu.</div>

      {goals.length > 0 && (
        <div className="space-y-3 mb-4">
          {goals.map((g) => (
            <div key={g.id} className="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-4 py-3 shadow-sm group hover:border-slate-200 transition-colors">
              <div className="min-w-0 pr-2">
                <div className="text-sm font-bold text-slate-800 truncate mb-0.5">{g.name}</div>
                <div className="text-[11px] font-medium text-slate-500 truncate flex items-center gap-1.5">
                  <span className="bg-slate-100 px-2 py-0.5 rounded-full">{g.category}</span>
                  Target <span className="font-jakarta font-bold text-emerald-600">{formatRupiah(g.target)}</span>
                </div>
              </div>
              <button onClick={() => deleteGoal(g.id)} className="p-2 text-slate-400 hover:bg-rose-50 hover:text-rose-600 rounded-lg transition-colors flex-shrink-0"><Trash2 size={16} /></button>
            </div>
          ))}
        </div>
      )}

      <div className="space-y-3 p-4 bg-slate-50 rounded-2xl border border-slate-100 border-dashed">
        <input
          value={name}
          onChange={(e) => { setName(e.target.value); setError(''); }}
          placeholder="Nama Tujuan (mis. Dana Darurat)"
          className="w-full bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-medium text-slate-800 outline-none focus:border-blue-400 shadow-sm"
        />
        <div className="flex gap-2">
          <select
            value={category}
            onChange={(e) => setCategory(e.target.value)}
            className="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-bold text-slate-700 outline-none focus:border-blue-400 shadow-sm"
          >
            {categories.keluar.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
          <div className="flex items-center bg-white border border-slate-200 rounded-xl px-3 focus-within:border-blue-400 shadow-sm">
            <span className="text-xs font-bold text-slate-400 mr-1">Rp</span>
            <input
              inputMode="numeric"
              value={target ? Number(target).toLocaleString('id-ID') : ''}
              onChange={(e) => { setTarget(e.target.value.replace(/[^0-9]/g, '')); setError(''); }}
              placeholder="Target"
              className="w-20 sm:w-24 bg-transparent outline-none text-sm font-jakarta font-bold py-2.5 text-right text-slate-800"
            />
          </div>
        </div>
        {error && <div className="text-xs font-bold text-rose-500 pl-1">{error}</div>}
        <button onClick={addGoal} className="w-full py-2.5 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm hover:bg-slate-800 transition-colors">
          Simpan Target Baru
        </button>
      </div>
    </div>
  );
}

function SettingsSheet({ pins, onChangePin, onClearAll, onClose, sheetUrl, syncStatus, syncMsg, onConnectSheet, onDisconnectSheet, onPullFromSheet, onPushToSheet, categories, onSaveCategories, budgets, onSaveBudgets, recurring, onSaveRecurring, goals, onSaveGoals }) {
  const [who, setWho] = useState('Abi');
  const [oldPin, setOldPin] = useState('');
  const [newPin, setNewPin] = useState('');
  const [confirmPin, setConfirmPin] = useState('');
  const [msg, setMsg] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);

  const submit = () => {
    if (oldPin !== pins[who]) { setMsg({ type: 'err', text: 'PIN lama salah.' }); return; }
    if (!/^\d{4}$/.test(newPin)) { setMsg({ type: 'err', text: 'PIN baru harus 4 angka.' }); return; }
    if (newPin !== confirmPin) { setMsg({ type: 'err', text: 'Konfirmasi PIN tidak cocok.' }); return; }
    onChangePin(who, newPin);
    setMsg({ type: 'ok', text: 'PIN berhasil diperbarui.' });
    setOldPin(''); setNewPin(''); setConfirmPin('');
  };

  return (
    <div className="fixed inset-0 z-50 flex justify-center items-end bg-slate-900/40 backdrop-blur-sm">
      <div className="w-full max-w-md bg-white rounded-t-[2rem] pt-6 pb-8 px-6 max-h-[90vh] overflow-y-auto modal-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.1)] custom-scrollbar">
        
        <div className="sticky top-0 bg-white pb-4 z-10 flex items-center justify-between mb-2">
          <div className="text-lg font-extrabold text-slate-900 font-jakarta flex items-center gap-2"><Settings size={20}/> Pengaturan</div>
          <button onClick={onClose} className="p-2 bg-slate-100 text-slate-500 hover:text-slate-900 hover:bg-slate-200 rounded-full transition-colors"><X size={20} strokeWidth={2.5} /></button>
        </div>

        <DataSourceSection sheetUrl={sheetUrl} syncStatus={syncStatus} syncMsg={syncMsg} onConnectSheet={onConnectSheet} onDisconnectSheet={onDisconnectSheet} onPullFromSheet={onPullFromSheet} onPushToSheet={onPushToSheet} />
        
        <div className="h-px w-full bg-slate-100 my-8"></div>

        <CategoryManager categories={categories} onSave={onSaveCategories} recurring={recurring} onSaveRecurring={onSaveRecurring} budgets={budgets} onSaveBudgets={onSaveBudgets} />
        
        <div className="h-px w-full bg-slate-100 my-8"></div>

        <BudgetManager categories={categories} budgets={budgets} onSave={onSaveBudgets} />
        
        <div className="h-px w-full bg-slate-100 my-8"></div>

        <SavingsGoalManager categories={categories} goals={goals} onSave={onSaveGoals} />
        
        <div className="h-px w-full bg-slate-100 my-8"></div>

        <div className="mb-8">
          <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Keamanan Akses</div>
          
          <div className="flex gap-2 mb-4">
            {['Abi', 'Umi'].map((u) => {
              const active = who === u;
              const isAbi = u === 'Abi';
              const activeClasses = isAbi ? 'bg-blue-600 text-white shadow-md border-blue-600' : 'bg-violet-600 text-white shadow-md border-violet-600';
              return (
                <button
                  key={u}
                  onClick={() => { setWho(u); setMsg(null); }}
                  className={`px-5 py-2 rounded-xl text-xs font-bold transition-all border ${
                    active ? activeClasses : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'
                  }`}
                >
                  Ubah PIN {u}
                </button>
              );
            })}
          </div>

          <div className="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-100 border-dashed">
            <input type="password" inputMode="numeric" maxLength={4} placeholder="PIN saat ini" value={oldPin}
              onChange={(e) => setOldPin(e.target.value.replace(/\D/g, ''))}
              className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-center tracking-[0.5em] text-slate-800 outline-none focus:border-blue-400 shadow-sm" />
            <input type="password" inputMode="numeric" maxLength={4} placeholder="PIN Baru" value={newPin}
              onChange={(e) => setNewPin(e.target.value.replace(/\D/g, ''))}
              className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-center tracking-[0.5em] text-slate-800 outline-none focus:border-blue-400 shadow-sm" />
            <input type="password" inputMode="numeric" maxLength={4} placeholder="Konfirmasi PIN Baru" value={confirmPin}
              onChange={(e) => setConfirmPin(e.target.value.replace(/\D/g, ''))}
              className="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-center tracking-[0.5em] text-slate-800 outline-none focus:border-blue-400 shadow-sm" />
            
            {msg && <div className={`text-xs font-bold text-center mt-2 ${msg.type === 'ok' ? 'text-emerald-600' : 'text-rose-500'}`}>{msg.text}</div>}
            
            <button onClick={submit} className="w-full py-3 mt-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm hover:bg-slate-800 transition-colors">
              Terapkan PIN Baru
            </button>
          </div>
        </div>

        <div className="pt-6 border-t-2 border-rose-100 rounded-t-3xl border-dashed">
          <div className="text-xs font-bold uppercase tracking-wider text-rose-500 mb-3 flex items-center gap-1.5">Zona Berbahaya</div>
          {!confirmClear ? (
            <button onClick={() => setConfirmClear(true)} className="w-full text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 py-3 rounded-xl transition-colors">

            <div className="bg-rose-50 p-4 rounded-xl border border-rose-200">

              </div>
            </div>
          )}
        </div>

      </div>
    </div>
  );
}

/* ---- STREAMING_CHUNK: App Initialization & Main Component ---- */
const DEFAULT_BUDGETS = {};
const DEFAULT_RECURRING = [];
const DEFAULT_GOALS = [];

function App() {
  const [loading, setLoading] = useState(true);
  const [pins, setPins] = useState(DEFAULT_PINS);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [budgets, setBudgets] = useState(DEFAULT_BUDGETS);
  const [recurring, setRecurring] = useState(DEFAULT_RECURRING);
  const [goals, setGoals] = useState(DEFAULT_GOALS);
  const [transactions, setTransactions] = useState([]);
  const [loggedInUser, setLoggedInUser] = useState(null);
  const [tab, setTab] = useState('catat');
  const [editingTx, setEditingTx] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [harianDate, setHarianDate] = useState(localDateStr());
  const [sheetUrl, setSheetUrl] = useState('');
  const [syncStatus, setSyncStatus] = useState('local');
  const [syncMsg, setSyncMsg] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let url = '';
      try {
        const res = await window.storage.get('sheet_url', true);
        url = res ? res.value : '';
      } catch (e) { url = ''; }
      if (!cancelled) setSheetUrl(url);

      let cachedTx = [];
      try {
        const res = await window.storage.get('transactions', true);
        cachedTx = res ? JSON.parse(res.value) : [];
      } catch (e) { cachedTx = []; }
      if (!cancelled) setTransactions(cachedTx);

      let localPins = DEFAULT_PINS;
      try {
        const res = await window.storage.get('pins', true);
        localPins = res ? JSON.parse(res.value) : DEFAULT_PINS;
      } catch (e) { localPins = DEFAULT_PINS; }
      if (!cancelled) setPins(localPins);

      let localCategories = DEFAULT_CATEGORIES;
      try {
        const res = await window.storage.get('categories', true);
        localCategories = res ? JSON.parse(res.value) : DEFAULT_CATEGORIES;
      } catch (e) { localCategories = DEFAULT_CATEGORIES; }
      if (!cancelled) setCategories(localCategories);

      let localBudgets = DEFAULT_BUDGETS;
      try {
        const res = await window.storage.get('budgets', true);
        localBudgets = res ? JSON.parse(res.value) : DEFAULT_BUDGETS;
      } catch (e) { localBudgets = DEFAULT_BUDGETS; }
      if (!cancelled) setBudgets(localBudgets);

      let localRecurring = DEFAULT_RECURRING;
      try {
        const res = await window.storage.get('recurring', true);
        localRecurring = res ? JSON.parse(res.value) : DEFAULT_RECURRING;
      } catch (e) { localRecurring = DEFAULT_RECURRING; }
      if (!cancelled) setRecurring(localRecurring);

      let localGoals = DEFAULT_GOALS;
      try {
        const res = await window.storage.get('goals', true);
        localGoals = res ? JSON.parse(res.value) : DEFAULT_GOALS;
      } catch (e) { localGoals = DEFAULT_GOALS; }
      if (!cancelled) setGoals(localGoals);

      if (url) {
        try {
          const remote = await sheetsGet(url);
          if (!cancelled) {
            setTransactions(remote.transactions);
            try { await window.storage.set('transactions', JSON.stringify(remote.transactions), true); } catch (e) {}

            if (remote.pins) {
              setPins(remote.pins);
              try { await window.storage.set('pins', JSON.stringify(remote.pins), true); } catch (e) {}
            }
            if (remote.categories) {
              setCategories(remote.categories);
              try { await window.storage.set('categories', JSON.stringify(remote.categories), true); } catch (e) {}
            }
            if (remote.budgets) {
              setBudgets(remote.budgets);
              try { await window.storage.set('budgets', JSON.stringify(remote.budgets), true); } catch (e) {}
            }
            if (remote.recurring) {
              setRecurring(remote.recurring);
              try { await window.storage.set('recurring', JSON.stringify(remote.recurring), true); } catch (e) {}
            }
            if (remote.goals) {
              setGoals(remote.goals);
              try { await window.storage.set('goals', JSON.stringify(remote.goals), true); } catch (e) {}
            }
            if (!remote.pins || !remote.categories || !remote.budgets || !remote.recurring || !remote.goals) {
              try {
                await sheetsPostSettings(url, {
                  pins: remote.pins ? undefined : localPins,
                  categories: remote.categories ? undefined : localCategories,
                  budgets: remote.budgets ? undefined : localBudgets,
                  recurring: remote.recurring ? undefined : localRecurring,
                  goals: remote.goals ? undefined : localGoals,
                });
              } catch (e) {}
            }
            setSyncStatus('connected');
          }
        } catch (e) {
          if (!cancelled) { setSyncStatus('error'); setSyncMsg('Gagal memuat dari Google Sheet, memakai data lokal sementara.'); }
        }
      }

      if (!cancelled) setLoading(false);
    })();
    return () => { cancelled = true; };
  }, []);

  const persistCategories = useCallback(async (next) => {
    setCategories(next);
    try { await window.storage.set('categories', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      try { await sheetsPostSettings(sheetUrl, { categories: next }); } catch (e) {
        setSyncStatus('error');
        setSyncMsg('Kategori tersimpan lokal, tapi gagal dikirim ke Google Sheet.');
      }
    }
  }, [sheetUrl]);

  const persistBudgets = useCallback(async (next) => {
    setBudgets(next);
    try { await window.storage.set('budgets', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      try { await sheetsPostSettings(sheetUrl, { budgets: next }); } catch (e) {
        setSyncStatus('error');
        setSyncMsg('Anggaran tersimpan lokal, tapi gagal dikirim ke Google Sheet.');
      }
    }
  }, [sheetUrl]);

  const persistRecurring = useCallback(async (next) => {
    setRecurring(next);
    try { await window.storage.set('recurring', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      try { await sheetsPostSettings(sheetUrl, { recurring: next }); } catch (e) {
        setSyncStatus('error');
        setSyncMsg('Kategori rutin tersimpan lokal, tapi gagal dikirim ke Google Sheet.');
      }
    }
  }, [sheetUrl]);

  const persistGoals = useCallback(async (next) => {
    setGoals(next);
    try { await window.storage.set('goals', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      try { await sheetsPostSettings(sheetUrl, { goals: next }); } catch (e) {
        setSyncStatus('error');
        setSyncMsg('Target tabungan tersimpan lokal, tapi gagal dikirim ke Google Sheet.');
      }
    }
  }, [sheetUrl]);

  const persistTransactions = useCallback(async (next) => {
    setTransactions(next);
    try { await window.storage.set('transactions', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      setSyncStatus('syncing');
      try {
        await sheetsPost(sheetUrl, { action: 'replaceAll', items: next });
        setSyncStatus('connected');
        setSyncMsg(null);
      } catch (e) {
        setSyncStatus('error');
        setSyncMsg('Gagal menyimpan ke Google Sheet. Perubahan tersimpan lokal saja — coba "Kirim ke Sheet" di Pengaturan.');
      }
    }
  }, [sheetUrl]);

  const handleConnectSheet = async (url) => {
    if (!url) return;
    setSyncStatus('syncing');
    setSyncMsg(null);
    try {
      const remote = await sheetsGet(url);
      setSheetUrl(url);
      try { await window.storage.set('sheet_url', url, true); } catch (e) {}
      setTransactions(remote.transactions);
      try { await window.storage.set('transactions', JSON.stringify(remote.transactions), true); } catch (e) {}

      if (remote.pins) { setPins(remote.pins); try { await window.storage.set('pins', JSON.stringify(remote.pins), true); } catch (e) {} }
      if (remote.categories) { setCategories(remote.categories); try { await window.storage.set('categories', JSON.stringify(remote.categories), true); } catch (e) {} }
      if (remote.budgets) { setBudgets(remote.budgets); try { await window.storage.set('budgets', JSON.stringify(remote.budgets), true); } catch (e) {} }
      if (remote.recurring) { setRecurring(remote.recurring); try { await window.storage.set('recurring', JSON.stringify(remote.recurring), true); } catch (e) {} }
      if (remote.goals) { setGoals(remote.goals); try { await window.storage.set('goals', JSON.stringify(remote.goals), true); } catch (e) {} }

      if (!remote.pins || !remote.categories || !remote.budgets || !remote.recurring || !remote.goals) {
        try {
          await sheetsPostSettings(url, {
            pins: remote.pins ? undefined : pins,
            categories: remote.categories ? undefined : categories,
            budgets: remote.budgets ? undefined : budgets,
            recurring: remote.recurring ? undefined : recurring,
            goals: remote.goals ? undefined : goals,
          });
        } catch (e) {}
      }

      setSyncStatus('connected');
      setSyncMsg('Berhasil tersambung ke Google Sheet.');
    } catch (e) {
      setSyncStatus('error');
      setSyncMsg('Gagal menyambung. Pastikan URL Web App benar dan akses deployment diset "Anyone".');
    }
  };

  const handleDisconnectSheet = async () => {
    setSheetUrl('');
    try { await window.storage.set('sheet_url', '', true); } catch (e) {}
    setSyncStatus('local');
    setSyncMsg('Kembali memakai penyimpanan lokal.');
  };

  const handlePullFromSheet = async () => {
    if (!sheetUrl) return;
    setSyncStatus('syncing');
    try {
      const remote = await sheetsGet(sheetUrl);
      setTransactions(remote.transactions);
      try { await window.storage.set('transactions', JSON.stringify(remote.transactions), true); } catch (e) {}
      if (remote.pins) { setPins(remote.pins); try { await window.storage.set('pins', JSON.stringify(remote.pins), true); } catch (e) {} }
      if (remote.categories) { setCategories(remote.categories); try { await window.storage.set('categories', JSON.stringify(remote.categories), true); } catch (e) {} }
      if (remote.budgets) { setBudgets(remote.budgets); try { await window.storage.set('budgets', JSON.stringify(remote.budgets), true); } catch (e) {} }
      if (remote.recurring) { setRecurring(remote.recurring); try { await window.storage.set('recurring', JSON.stringify(remote.recurring), true); } catch (e) {} }
      if (remote.goals) { setGoals(remote.goals); try { await window.storage.set('goals', JSON.stringify(remote.goals), true); } catch (e) {} }
      setSyncStatus('connected');
      setSyncMsg('Data terbaru berhasil ditarik dari Google Sheet.');
    } catch (e) {
      setSyncStatus('error');
      setSyncMsg('Gagal menarik data dari Google Sheet.');
    }
  };

  const handlePushToSheet = async () => {
    if (!sheetUrl) return;
    setSyncStatus('syncing');
    try {
      await sheetsPost(sheetUrl, { action: 'replaceAll', items: transactions });
      await sheetsPostSettings(sheetUrl, { pins, categories, budgets, recurring, goals });
      setSyncStatus('connected');
      setSyncMsg('Data lokal berhasil dikirim ke Google Sheet.');
    } catch (e) {
      setSyncStatus('error');
      setSyncMsg('Gagal mengirim data ke Google Sheet.');
    }
  };

  const persistPins = useCallback(async (next) => {
    setPins(next);
    try { await window.storage.set('pins', JSON.stringify(next), true); } catch (e) {}
    if (sheetUrl) {
      try { await sheetsPostSettings(sheetUrl, { pins: next }); } catch (e) {
        setSyncStatus('error');
        setSyncMsg('PIN tersimpan lokal, tapi gagal dikirim ke Google Sheet.');
      }
    }
  }, [sheetUrl]);

  const handleSaveTx = (tx) => {
    const exists = transactions.some((t) => t.id === tx.id);
    const next = exists ? transactions.map((t) => (t.id === tx.id ? tx : t)) : [...transactions, tx];
    persistTransactions(next);
    setEditingTx(null);
  };

  const handleDeleteTx = (id) => persistTransactions(transactions.filter((t) => t.id !== id));
  const handleChangePin = (who, val) => persistPins({ ...pins, [who]: val });
  const handleClearAll = () => persistTransactions([]);

  if (loading) {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50">
        <div className="w-12 h-12 rounded-full border-4 border-slate-200 border-t-blue-600 animate-spin mb-4"></div>
        <div className="text-slate-500 font-bold font-jakarta animate-pulse">Menyiapkan Buku Kas...</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full bg-slate-50 flex justify-center font-inter text-slate-800 selection:bg-blue-200">
      <div className="w-full max-w-md bg-white min-h-screen relative shadow-2xl flex flex-col overflow-hidden sm:border-x sm:border-slate-200">
        {!loggedInUser ? (
          <LockScreen pins={pins} onUnlock={setLoggedInUser} />
        ) : (
          <>
            {/* ---- STREAMING_CHUNK: Main App Layout & Header ---- */}
            <div className="bg-black text-white px-6 pt-8 pb-10 rounded-b-[2rem] shadow-lg z-10 relative flex justify-between items-start">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-2xl bg-white/10 flex items-center justify-center backdrop-blur-md border border-white/10 shadow-inner">
                  <Wallet size={24} className="text-blue-400" />
                </div>
                <div>
                  <div className="text-xl font-extrabold font-jakarta tracking-tight leading-tight">
                    Kas Keluarga
                  </div>
                  <div className="text-xs text-blue-200 font-medium mt-0.5 flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    Sesi aktif: {loggedInUser}
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setShowSettings(true)} className="p-2.5 rounded-xl bg-white/5 hover:bg-white/15 border border-white/5 transition-all"><Settings size={18} /></button>
                <button onClick={() => { setLoggedInUser(null); setTab('catat'); setEditingTx(null); }} className="p-2.5 rounded-xl bg-white/5 hover:bg-rose-500/20 hover:text-rose-400 border border-white/5 transition-all"><LogOut size={18} /></button>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="px-5 -mt-6 relative z-20 mb-6">
              <div className="flex p-1.5 bg-white shadow-[0_8px_30px_rgb(0,0,0,0.08)] border border-slate-100 rounded-2xl">
                {[
                  { key: 'catat', label: 'Catat' },
                  { key: 'harian', label: 'Harian' },
                  { key: 'bulanan', label: 'Bulanan' },
                  { key: 'cari', label: 'Cari' },
                ].map((t) => {
                  const active = tab === t.key;
                  return (
                    <button
                      key={t.key}
                      onClick={() => { setTab(t.key); if (t.key !== 'catat') setEditingTx(null); }}
                      className={`flex-1 py-2.5 text-xs font-bold rounded-xl transition-all duration-300 ${
                        active 
                          ? 'bg-slate-100 text-slate-900 shadow-sm' 
                          : 'bg-transparent text-slate-400 hover:text-slate-600'
                      }`}
                    >
                      {t.label}
                    </button>
                  );
                })}
              </div>
            </div>

            <div key={tab} className="tab-fade flex-1 overflow-y-auto custom-scrollbar">
              {tab === 'catat' && (
                <CatatTab
                  user={loggedInUser}
                  transactions={transactions}
                  onSave={handleSaveTx}
                  onEdit={(t) => setEditingTx(t)}
                  onDelete={handleDeleteTx}
                  editingTx={editingTx}
                  cancelEdit={() => setEditingTx(null)}
                  categories={categories}
                  recurring={recurring}
                />
              )}
              {tab === 'harian' && (
                <HarianTab
                  transactions={transactions}
                  onEdit={(t) => { setEditingTx(t); setTab('catat'); }}
                  onDelete={handleDeleteTx}
                  date={harianDate}
                  setDate={setHarianDate}
                />
              )}
              {tab === 'bulanan' && (
                <BulananTab
                  transactions={transactions}
                  onPickDay={(ds) => { setHarianDate(ds); setTab('harian'); }}
                  budgets={budgets}
                  goals={goals}
                />
              )}
              {tab === 'cari' && (
                <SearchTab
                  transactions={transactions}
                  onEdit={(t) => { setEditingTx(t); setTab('catat'); }}
                  onDelete={handleDeleteTx}
                />
              )}
            </div>
          </>
        )}
      </div>

      {showSettings && (
        <SettingsSheet
          pins={pins}
          onChangePin={handleChangePin}
          onClearAll={handleClearAll}
          onClose={() => setShowSettings(false)}
          sheetUrl={sheetUrl}
          syncStatus={syncStatus}
          syncMsg={syncMsg}
          onConnectSheet={handleConnectSheet}
          onDisconnectSheet={handleDisconnectSheet}
          onPullFromSheet={handlePullFromSheet}
          onPushToSheet={handlePushToSheet}
          categories={categories}
          onSaveCategories={persistCategories}
          budgets={budgets}
          onSaveBudgets={persistBudgets}
          recurring={recurring}
          onSaveRecurring={persistRecurring}
          goals={goals}
          onSaveGoals={persistGoals}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
